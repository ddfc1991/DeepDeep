name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
  push:
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEEPDEEP_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.DEEPDEEP_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::DEEPDEEP_KEYSTORE_B64 not set; falling back to default debug signing"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deepdeep.p12"
          echo "DEEPDEEP_KEYSTORE_PATH=$RUNNER_TEMP/deepdeep.p12" >> "$GITHUB_ENV"
          echo "DEEPDEEP_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "DEEPDEEP_KEYSTORE_ALIAS=deepdeep" >> "$GITHUB_ENV"
          echo "signing key prepared"

      - name: Check
        run: ./scripts/check.sh --full

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepdeep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/tests
            */build/reports/lint-results-*
            build/reports/problems
          if-no-files-found: ignore
